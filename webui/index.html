<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Device Faker</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="header-title">
          Device Faker <span class="chip" id="hdr-version">…</span>
        </h1>
        <div class="header-sub" id="hdr-sub">Zygisk 机型伪装</div>
      </header>

      <main class="page-stage">
        <div class="page-track" id="page-track">
          <section class="page-panel" data-page="status"></section>
          <section class="page-panel" data-page="templates"></section>
          <section class="page-panel" data-page="apps"></section>
          <section class="page-panel" data-page="settings"></section>
        </div>
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>

    <div class="toast-host" id="toast-host"></div>
    <div id="sheet-host"></div>

    <!-- 无构建、无模块系统：按依赖顺序加载普通脚本。
         不用 type="module" 是因为 WebUI 可能以 file:// 加载，
         ES module 在此场景会被 CORS 拦截导致白屏。 -->
    <script src="assets/js/toml.js"></script>
    <script src="assets/js/ksu.js"></script>
    <script src="assets/js/package.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
